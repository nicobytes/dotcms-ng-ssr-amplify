version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Angular 22 needs Node ^22.22.3 or ^24.15; the runtime in the manifest is nodejs24.x
        - nvm install 24
        - nvm use 24
        - node -v
        - npm ci
    build:
      commands:
        # Spike simplification: write the console env vars to .env so the compute can read them.
        - env | grep -E '^(DOTCMS_|NG_ALLOWED_HOSTS|SPIKE_DEBUG)' > .env || true
        - npm run build:amplify
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
